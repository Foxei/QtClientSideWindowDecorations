name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Release tag (e.g. v1.2.3) the version is taken from, empty for non-release builds
  RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker compose run --rm linux
      - name: Test install and find_package
        run: docker compose run --rm linux /src/docker/linux/test-install.sh
      - name: Package
        run: tar -czf ExampleApplication-linux-x64.tar.gz -C dist/linux .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: ExampleApplication-linux-x64.tar.gz

  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker compose run --rm windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/windows/ExampleApplication-windows-x64.zip

  # The macOS SDK is not available on Linux runners, so build natively here
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Build
        run: |
          cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DRELEASE_VERSION="$RELEASE_VERSION" \
              -DINSTALL_EXAMPLE=ON \
              -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
              -DCMAKE_INSTALL_PREFIX="$PWD/stage"
          cmake --build build --parallel
          cmake --install build
      - name: Package
        run: |
          APP="stage/Example Application.app"
          mkdir -p "$APP/Contents/Frameworks"
          mv stage/lib/libclient_side_window_decoration*.dylib "$APP/Contents/Frameworks/"
          macdeployqt "$APP"
          codesign --force --deep --sign - "$APP"
          tar -czf ExampleApplication-macos-universal.tar.gz -C stage "Example Application.app"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ExampleApplication-macos-universal.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: ExampleApplication-*
          generate_release_notes: true
